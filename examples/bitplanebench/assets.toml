# bitplane/Elias-gamma decode cost, on the watch -- the one number the whole
# investigation (docs/GAME-COMPARISON.md's session notes) never had until now. Real,
# pipeline-built content isn't needed here beyond a status font: the actual bench
# content (bitplane-encoded sprite frames/atlas tiles, pulled from overworld's and
# Need4Pebble's real built resources) is generated by tools' bpeg_encode.py mirror and
# declared as raw resources directly in package.json, the same way lzssbench's map
# banks are -- pnx_assets.py doesn't know this format, deliberately: it's not wired
# into the pipeline, only measured standalone (pnx_bitplane.c).

[project]
name = "bitplanebench"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 262144

[[font]]
name = "bench"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 14
depth = 1
threshold = 128
charset = " !%()+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
license = "SIL Open Font License 1.1"
out = "font_bench.bin"
