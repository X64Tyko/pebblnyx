# Combined-load frame cost: audio + graphics + text + an incremental save step, all in the
# same frame, on real hardware.
#
# DESIGN.md's open questions name this directly: "Combined-load frame cost. Each subsystem
# is measured; the sum, everything running at once against a single frame budget, never
# has been." This app is that sum. Graphics used to be synthesised (a fill_rect grid
# standing in for a tilemap, reasoning that tile-blit cost was already measured on its own
# in MEASUREMENTS.md) -- that stood until M9's 1-bit blitter existed to stress: the fill
# grid never touched a real atlas, sprite or tilemap draw, so it could not exercise the
# ~bw span writer, the palette-free BW path, or a sprite's canonical bw_variant bake under
# load the way a real map and a real character do. The fill_rect grid stays (it is still
# real load on pnx_gfx_fill_rect/clear), but a real map and sprite now draw alongside it.
# Audio, text and save are unchanged -- they were already the real framework paths.

[project]
name = "stressbench"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 262144

[[font]]
name = "bench"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 14
depth = 1
threshold = 128
charset = " !%()+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
license = "SIL Open Font License 1.1"
out = "font_bench.bin"

# Just something continuously streaming -- a loudness or musicality is not the point here.
[sample.tone]
file = "art/laser.wav"

# ---------------------------------------------------------------------------- graphics
#
# Placeholder art (tools/pnx_placeholder.py's own generators), not hand-authored: the
# point of this app is load, not content, and a repo cannot ship a third-party sheet
# anyway (see that tool's own header for why the other examples do this too).

[[atlas]]
name = "tiles"
sheet = "art/tileset.png"
tile = 16
region = [0, 0, 6, 1]
max_tiles = 6
out = "tiles.bin"
# Two more roles than before, so this app's atlas exercises every collision mode at
# once (see the [[atlas.collision]] entries below) rather than only SOLID -- the point
# of a "combined load" benchmark is that everything real ships with actually runs here.
autopick = ["floor", "wall", "accent", "fence", "niche"]

[[atlas.collision]]
tile = "wall"
type = "solid"

# A fence: solid only in its bottom half, the textbook SCALED case (docs/DESIGN.md's own
# example when the mode was designed).
[[atlas.collision]]
tile = "fence"
type = "scaled"
rect = [0, 8, 16, 8]

# A niche: COMPLEX with no authored `mask`, so its collision is derived from the tile's
# own opacity at build time (pack_collision_mask) -- the common case, exercised for real
# rather than only in a unit test fixture.
[[atlas.collision]]
tile = "niche"
type = "complex"

[[sprite]]
name = "hero"
sheet = "art/hero.png"
frames = [[0, 0, 16, 24], [0, 24, 16, 24], [0, 48, 16, 24]]
out = "hero.bin"
# A recolour, so the combined load also bakes and draws a sprite variant -- the case
# bw_variant exists for (tools/pnx_assets.py's own comment above it in pack_sprite).
variants = ["art/hero_alt.png"]
bw_variant = "hero_alt"

[sprite.anim]
stand = 0
step_a = 1
step_b = 2

[legend."."]
tile = "floor"
flags = []

[legend."#"]
tile = "wall"

[legend."~"]
tile = "accent"
flags = []

[legend."F"]
tile = "fence"
flags = []

[legend."N"]
tile = "niche"
flags = []

# Same art as "~", drawn transposed -- exercises PNX_MAP_ROTATE at render time
# (pnx_blit_4bpp's rotate path) alongside every other placement's ordinary blit.
[legend."R"]
tile = "accent"
flags = []
rotate = true

# An arbitrary per-cell tag, meaning nothing to the engine -- game code would read it
# through pnx_map_extended. Here only to get PNX_MAP_EXTENDED and the WorldTile's sparse
# tag table into a real compiled map instead of only a unit-test fixture.
[legend."E"]
tile = "floor"
flags = []
extended = 7

[[map]]
name = "field"
out = "map_field.bin"
start = [1, 1]
# Bigger than one screen (emery's 200x228 is ~12x14 tiles at 16px) so the camera driven
# in main.c genuinely scrolls and streams rather than showing the whole map at once --
# real tilemap load, not a static picture.
rows = """
##########################
#.......~....F.....N.....#
#...............~....R...#
#........................#
#........~...E...........#
#................~.......#
#.~......................#
#.........~..............#
#.................~......#
#..~.....................#
#..........~.............#
#..................~.....#
##########################
"""
