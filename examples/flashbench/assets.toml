# Flash read benchmark, v3: does read cost scale with a resource's OWN size, or with how
# much OTHER content precedes it in the .pbpack?
#
# v1 (one 220KB resource, seven offsets) found cost flat regardless of offset. v2 (five
# differently-sized resources, each read near-start and two-thirds-deep) found offset
# still does not matter, and cost scales with resource size -- but declared the five in
# ascending order, and `pbpack.py`'s own `finalize()` assigns offsets by walking
# resources in DECLARATION order, each placed right after the last. So v2's biggest
# resource was also always the one with the most other content before it: size and pack
# position were the same variable wearing two names, never actually separated. This
# version separates them: five identical 8KB probes (the real WorldTile bank size),
# interleaved with padding resources so each one sits behind a different amount of prior
# content -- 0, 50, 100, 150, 200 KB. Same size, five positions. See gen_flashdata.py's
# header for the full reasoning and why this also bears on the original WorldTile
# O(offset) finding (maps are declared, and so packed, after their atlases).
#
# Only a font is declared here. The probe/padding resources (`probe_0.bin`..`probe_4.bin`,
# `padding_0.bin`..`padding_3.bin`, generated by gen_flashdata.py -- run that first)
# bypass this manifest entirely -- there is no generic raw-blob asset type -- and are
# read directly via pnx_platform_resource_read(RESOURCE_ID_PROBE_*, ...); see main.c.
# Declared FIRST in package.json, ahead of PALETTES/BENCH, so probe_0 truly has ~0 bytes
# preceding it rather than a font and a palette table's worth.
#
# Consequence worth knowing before re-running `pnx_assets.py --package`: it rewrites
# package.json's ENTIRE media list from what THIS manifest declares, which does not
# include the probe/padding files. Re-running the pipeline's --package step wipes the
# hand-added entries and loses the deliberate declaration order; re-add them (see
# package.json) if that happens.
#
# budget_bytes raised from the usual 262144 (256KB, the appstore warning threshold): the
# probe/padding resources alone total ~208KB. Still comfortably under the 1MB device
# ceiling, which is the number that is actually enforced -- see MEASUREMENTS.md's Memory
# section. This app is never going to an appstore.

[project]
name = "flashbench"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 1048576

[[font]]
name = "bench"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 14
depth = 1
threshold = 128
charset = " !%()+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
license = "SIL Open Font License 1.1"
out = "font_bench.bin"
