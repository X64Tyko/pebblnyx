# Flash read benchmark, v2: does read cost scale with OFFSET within a resource, with the
# resource's own TOTAL SIZE, or both?
#
# v1 tested one 220KB resource at seven offsets and got a flat ~40ms regardless of offset
# or length -- which does not match the original WorldTile streaming finding at all (that
# one, read off session-log totals rather than bracketed per call, found reads costing
# 46-305ms depending on offset within a 75KB map resource). The two results cannot both
# be O(offset) in the same resource. This version separates the two variables: five
# resources at different total sizes (8KB, matching a WorldTile bank; 75KB, matching the
# pre-banking map resource the original finding used; 32/150/220KB filling the curve),
# each read at a near-origin offset and a "two-thirds-deep" one -- the original finding's
# own language -- so the grid can show which variable actually drives the cost.
#
# Only a font is declared here. The five test resources (`flashdata_8k.bin` through
# `flashdata_220k.bin`, generated by gen_flashdata.py -- run that first) bypass this
# manifest entirely -- there is no generic raw-blob asset type -- and are read directly
# via pnx_platform_resource_read(RESOURCE_ID_FLASHDATA_*, ...); see main.c.
#
# Consequence worth knowing before re-running `pnx_assets.py --package`: it rewrites
# package.json's ENTIRE media list from what THIS manifest declares, which does not
# include the flashdata_*.bin files. Re-running the pipeline's --package step wipes the
# five hand-added FLASHDATA_* entries; re-add them (see package.json) if that happens.
#
# budget_bytes raised from the usual 262144 (256KB, the appstore warning threshold): the
# five test resources alone total ~490KB. Still comfortably under the 1MB device ceiling,
# which is the number that is actually enforced -- see MEASUREMENTS.md's Memory section.
# This app is never going to an appstore.

[project]
name = "flashbench"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 1048576

[[font]]
name = "bench"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 14
depth = 1
threshold = 128
charset = " !%()+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
license = "SIL Open Font License 1.1"
out = "font_bench.bin"
