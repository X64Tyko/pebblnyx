# Asset manifest for the overworld example.
#
# This is the single source of truth for content. No C file names a PNG, a pixel offset,
# a sheet layout or a magic tile id -- everything reaches game code through the header
# that tools/pnx_assets.py generates from this file.
#
# Build it with:
#     ../../tools/pnx_assets.py assets.toml --preview

[project]
name = "overworld"
resources = "resources"
header = "src/c/assets_gen.h"

# Where the button cluster sits when the watch is held to play, which is what decides
# whether the display is portrait or landscape. Named for the cluster rather than for a
# rotation because that is the thing being chosen: under one thumb it reads as a menu
# column, along the top edge as shoulder triggers, along the bottom as flippers.
#
#   portrait | buttons_right   the display's own orientation, and the default
#   buttons_top                landscape, cluster under both index fingers
#   buttons_bottom             landscape, cluster under both thumbs
#
# Content is rotated at BUILD time -- atlases, sprites, maps and glyphs all come out
# turned, so the engine's ordinary blit draws a correct landscape screen and no game code
# changes. Try it without editing this line:
#
#     ../../tools/pnx_assets.py assets.toml --orientation buttons_top
#
# The buttons do NOT rotate, which is what src/pnx/input/ is for. See docs/ROADMAP.md, M4c.
orientation = "portrait"
# The appstore rejects bundles over 256KB of resources. The device's hard cap is 1MB,
# but shipping is the constraint that actually binds.
budget_bytes = 262144

# ---------------------------------------------------------------------------- atlas

[[atlas]]
name = "tiles"
sheet = "art/world.png"
tile = 16
# In TILE units, not pixels. A carve, not the whole sheet: five complete tilesets come to
# 111% of the 256KB appstore budget, while a region of each is a fraction of it. Carving
# is where the content budget is won -- see docs/MEASUREMENTS.md.
region = [0, 0, 10, 6]
max_tiles = 48
out = "tiles.bin"
# Picked by the pipeline for legibility rather than hardcoded: a flat tile for floor,
# the most visually distant flat tile for wall, the busiest for accent. Replace with an
# explicit `semantic` table once there is an artist -- the legend below and all game
# code stay unchanged when that happens.
autopick = ["floor", "wall", "accent"]
# Composes each 16x16 tile from four deduplicated 8x8 quadrants. Left off here: the
# pipeline picks by arithmetic and this 64-tile region is too small to benefit (1.19x
# quadrant reuse against 1.96x on full sheets), and the runtime does not read the layout
# yet. Set `metatiles = true` to force it, or "auto" to let the pipeline choose.
# A fraction sets this atlas's own threshold: take metatiles when they save at least
# this much. true/false force it, "auto" uses the pipeline default of 12%.
metatiles = 0.12

# --------------------------------------------------------------------------- sprites

# Three 16x24 frames stacked vertically: a stand pose and two mid-strides. One direction
# only -- other facings come from mirroring at draw time, which is how the real sheets
# this was developed against were laid out too.
[[sprite]]
name = "hero"
sheet = "art/hero.png"
frames = [[0, 0, 16, 24], [0, 24, 16, 24], [0, 48, 16, 24]]
out = "hero.bin"

[sprite.anim]
stand = 0
step_a = 1
step_b = 2

[[sprite]]
name = "npc"
sheet = "art/npc.png"
frames = [[0, 0, 16, 24]]
out = "npc.bin"
# Palette swaps. Same art, recoloured: each variant costs a 16-byte palette instead of
# another 192-byte copy of the frame. The pipeline checks they really are recolours.
variants = ["art/npc_ice.png", "art/npc_rust.png"]

# ----------------------------------------------------------------------------- fonts

# Two faces, because a HUD and a dialogue box want different things: the HUD needs to
# stay out of the way and be readable at a glance, dialogue needs to be comfortable for
# a paragraph. They are the same system with a glyph map each.
#
# `license` is required. Rasterising a typeface into the bundle redistributes it even
# though the outlines stay behind, so the terms are recorded here rather than remembered.

[[font]]
name = "hud"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 12
depth = 1              # crisp: at 12px, antialiasing muddies more than it smooths
threshold = 128        # the greyscale cutoff. Move it in the editor and watch stems
                       # appear and vanish -- there is no correct value, only a legible
                       # one for a given face at a given size.
# Derived from the dialog pages below, so the atlas carries what the game actually says
# and nothing else. `extra` covers runtime strings no page contains -- a damage number
# appears in no conversation.
charset = "auto"
extra = "0123456789/%:"
license = "SIL Open Font License 1.1"
out = "font_hud.bin"

[[font]]
name = "dialogue"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 16
depth = 2              # antialiased: at 16px the extra coverage levels are legible
                       # rather than muddy, and dialogue is read rather than glanced at
threshold = 24         # at depth 2 this is the black point, not a cutoff
charset = "auto"
license = "SIL Open Font License 1.1"
out = "font_dialogue.bin"

# ---------------------------------------------------------------------------- legend

[legend."."]
tile = "floor"
flags = []

[legend."#"]
tile = "wall"
atlas = "tiles"
flags = ["solid"]

[legend."~"]
tile = "accent"
flags = []

# A door: walkable, and triggers a transition when stepped on.
[legend."D"]
tile = "accent"
flags = ["warp"]

# `atlas` names which of a map's tilesets the role resolves against. Without it a role
# resolves against the map's FIRST atlas, which is what every single-tileset map means.
#
# The legend is project-wide but an atlas set is per map, so a map that does not draw from
# `water` simply never uses this character; only a map that uses it AND lacks the atlas is
# an error, and the pipeline names the cell.
[legend."w"]
tile = "floor"
atlas = "water"
flags = ["solid"]

# ------------------------------------------------------------------------------ maps

[[map]]
name = "outdoor"
out = "map_outdoor.bin"
start = [15, 11]
# Buildings are SOLID blocks with a door on the front face, not hollow rooms. A hollow
# room on the overworld is a room you can never enter, and if the door sits inside it
# the warp is unreachable -- which is exactly the bug that motivated the flood-fill
# check in the pipeline.
warps = [{ at = [15, 9], to = ["cave", 12, 13] }]
rows = """
################################
#..............................#
#..............................#
#....~~~~..........~~~~........#
#....~~~~..........~~~~........#
#..............................#
#..........########............#
#..........########............#
#..........########............#
#..........####D###............#
#..............................#
#..............................#
#......~~......................#
#......~~..........####........#
#..................####........#
#..................####........#
#..............................#
#..............................#
#....######....................#
#....######....................#
#....######....................#
#..............................#
#..............................#
################################
"""

[[map]]
name = "cave"
atlas = "caveset"
palette = "dungeon_ice"
out = "map_cave.bin"
start = [12, 13]
# Destinations land one tile clear of the far door, so arriving does not immediately
# re-trigger the return warp and bounce the player back.
warps = [{ at = [12, 14], to = ["outdoor", 15, 10] }]
rows = """
########################
#......................#
#..####..........####..#
#..####..........####..#
#..####..........####..#
#......................#
#..........~~..........#
#..........~~..........#
#......................#
#..####..........####..#
#..####..........####..#
#..####..........####..#
#......................#
#......................#
#...........D..........#
########################
"""

# ---------------------------------------------------------------------------- dialog

# Text is content, so it lives here rather than as string literals in C. Each entry is
# a list of pages; a page is one screenful.

[dialog.npc_greeting]
pages = [
  "Careful in there.",
  "The mines run deep, and the lamps went out weeks ago.",
  "Take a torch if you find one.",
]

[dialog.npc_repeat]
pages = ["Still here?"]

# ---------------------------------------------------------------------------- scenes

# A scene is the only load point the framework has, so it is the right unit to declare.
# The pipeline checks every reference resolves and reports what each scene costs
# resident, which is the number that sizes the arena -- total resource size only says
# what ships.

# A scene no longer lists its map's tilesets. The map declares them, sizes its own atlas
# pool and streams them, so naming one here would just load a second resident copy -- and
# the pipeline says so rather than letting the bytes go quietly missing.

[scene.outdoor]
map = "outdoor"
sprites = ["hero", "npc"]
fonts = ["hud", "dialogue"]
dialog = true

[scene.cave]
map = "cave"
sprites = ["hero"]
# No dialogue face here: the cave has no conversations, and a font it never draws is
# ~900 bytes of scene arena spent on nothing.
fonts = ["hud"]


[[atlas]]
name = "caveset"
sheet = "art/dungeon.png"
tile = 16
# In TILE units, not pixels.
region = [0, 0, 10, 6]
max_tiles = 128
out = "caveset.bin"
# The same tileset recoloured. Costs a few palettes plus 44 bytes in each map that uses it,
# against ~5,600 bytes for a second copy of the atlas.
variants = ["art/dungeon_ice.png"]
metatiles = "auto"
# Roles the legend can name. Autopicked so the atlas is usable the moment it is
# imported; replace with an explicit [atlas.semantic] table once you know which tiles
# you want, and no map or game code changes.
autopick = ["floor", "wall", "accent"]

# ----------------------------------------------------------------------------- music

# Instruments are generated waveforms, so a song costs only its notes -- a few hundred
# bytes, against the tens of kilobytes a recorded loop would need. That ratio is the whole
# reason the sequencer exists rather than streaming audio files.

[music.overworld]
tempo = 112
channels = 4

[[music.overworld.instrument]]
wave = "triangle"     # 0: lead
attack = 5
decay = 90
sustain = 170
release = 140

[[music.overworld.instrument]]
wave = "square"       # 1: bass
attack = 2
decay = 40
sustain = 200
release = 60

# Notes are named, not numbered: C4 tells you where it sits, 60 does not. '.' holds the
# previous note, '-' releases it. Four cells per row, one per channel.
[[music.overworld.pattern]]
rows = [
  "A3:0 .    .    E2:1",
  ".    .    .    .   ",
  "C4:0 .    .    .   ",
  ".    .    .    -   ",
  "E4:0 .    .    A2:1",
  ".    .    .    .   ",
  "C4:0 .    .    .   ",
  ".    .    .    -   ",
  "B3:0 .    .    G2:1",
  ".    .    .    .   ",
  "G3:0 .    .    .   ",
  ".    .    .    -   ",
  "A3:0 .    .    E2:1",
  ".    .    .    .   ",
  "-    .    .    .   ",
  ".    .    .    -   ",
]

order = [0, 0]

# ---------------------------------------------------------------------------- samples

# Short effects only. One second of PCM is 16KB and roughly 70KB remains after art, so the
# pipeline caps samples at 1.5s and says so rather than letting a bundle grow past the
# appstore limit. Anything sustained belongs in [music.*], where it costs bytes not
# kilobytes.

[sample.blip]
file = "art/blip.wav"


# The multi-atlas case, and the reason maps carry an atlas LIST: a ship on open water is
# two tilesets that were drawn, carved and palettised separately. Merging them into one
# atlas to satisfy the old one-tileset rule would have cost a second copy of whichever
# tiles the other map also wanted.
#
# Cells name a MAP-GLOBAL tile id -- `ship` takes ids 0..59 and `water` 60..79 -- so the
# order of this list is what fixes the id space. Changing it rebuilds the map; it does not
# invalidate anything else.
#
# Named `deck` rather than `ship` because an atlas here is already called `ship`, and a
# resource name is a #define in the SDK's generated header regardless of what kind of
# asset produced it. The pipeline refuses the collision now; before it did, the only sign
# was a redefinition warning in a generated file naming neither asset.
[[map]]
name = "deck"
atlases = ["ship", "water"]
out = "map_deck.bin"
start = [10, 3]
warps = []
rows = """
wwwwwwwwwwwwwwwwwwwwwwww
wwwww##############wwwww
wwww#..............#wwww
www#................#www
www#................#www
www#....~~~~~~......#www
www#....~~~~~~......#www
www#................#www
www#................#www
www#................#www
wwww#..............#wwww
wwwww##############wwwww
wwwwwwwwwwwwwwwwwwwwwwww
wwwwwwwwwwwwwwwwwwwwwwww
wwwwwwwwwwwwwwwwwwwwwwww
wwwwwwwwwwwwwwwwwwwwwwww
"""


[[atlas]]
name = "ship"
sheet = "art/ship.png"
tile = 32
# In TILE units, not pixels.
region = [3, 0, 9, 8]
max_tiles = 128
out = "ship.bin"
# Pixels of this exact colour become transparent. Sheets drawn on a flat
# background with no alpha channel need this; art with real alpha does not.
colorkey = [255, 103, 139]

metatiles = "auto"
# Roles the legend can name. Autopicked so the atlas is usable the moment it is
# imported; replace with an explicit [atlas.semantic] table once you know which tiles
# you want, and no map or game code changes.
autopick = ["floor", "wall", "accent"]


# Cells dropped in the editor. Indices into the region, read left to right,
# top to bottom -- so they follow the region above and change with it.
exclude = [
  42, 43, 44, 51, 52, 53, 60, 61, 62, 69, 70, 71
]
[[atlas]]
name = "water"
sheet = "art/ship.png"
tile = 32
# In TILE units, not pixels.
region = [0, 0, 3, 8]
max_tiles = 128
out = "water.bin"
# Pixels of this exact colour become transparent. Sheets drawn on a flat
# background with no alpha channel need this; art with real alpha does not.
colorkey = [255, 103, 139]
# Cells dropped in the editor. Indices into the region, read left to right,
# top to bottom -- so they follow the region above and change with it.
exclude = [
  3, 15, 20, 23
]

metatiles = "auto"
# Roles the legend can name. Autopicked so the atlas is usable the moment it is
# imported; replace with an explicit [atlas.semantic] table once you know which tiles
# you want, and no map or game code changes.
autopick = ["floor", "wall", "accent"]


[[atlas]]
name = "ship_acc"
sheet = "art/ship.png"
tile = 32
# In TILE units, not pixels.
region = [9, 0, 6, 8]
max_tiles = 128
out = "ship_acc.bin"
# Pixels of this exact colour become transparent. Sheets drawn on a flat
# background with no alpha channel need this; art with real alpha does not.
colorkey = [255, 103, 139]
# Cells dropped in the editor. Indices into the region, read left to right,
# top to bottom -- so they follow the region above and change with it.
exclude = [
  0, 1, 2, 6, 7, 8, 12, 13, 14, 18, 19, 20
]

metatiles = "auto"
# Roles the legend can name. Autopicked so the atlas is usable the moment it is
# imported; replace with an explicit [atlas.semantic] table once you know which tiles
# you want, and no map or game code changes.
autopick = ["floor", "wall", "accent"]
