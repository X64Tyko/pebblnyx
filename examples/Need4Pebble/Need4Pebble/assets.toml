# --------------------------------------------------------------------------- menu

# The pause/game-over menus and the HUD event banner ("CHECKPOINT +500") -- uppercase
# and short by choice, so `extra` can just be every uppercase letter plus space/colon/
# digits/plus rather than tracking exact wording here. Digits+"+" were added alongside
# checkpoint/score scoring (render.c's draw_hud_event, draw_game_over's score line) --
# without them those draws silently render nothing for any character outside this set
# (FONT_ABSENT, pnx_assets.py), which is exactly what happened before this line changed.
#
# Was LiberationSans (a plain UI face), then "Monster Racing" (a display face, needing a
# `tracking` bump to stop its letters visibly touching at 14px -- reported "almost
# unreadable"), then briefly "Racing Energy" instead (a readability worry that turned out
# to already be fixed by the tracking bump -- confirmed via an emulator screenshot taken
# right before the swap). Landed here: BOTH faces at once, one packed font --
# `overlay_source`/`overlay_charset` (pnx_assets.py's own font-building code) rasterise
# just the digits/`+` from Monster Racing (whose numerals "looked fine") while every
# other character still comes from Racing Energy (the letters direct feedback preferred)
# -- "Numbers = Monster Racing. Text = Racing Energy," and "just combine all the
# rendered glyphs into a single font" rather than a game splitting strings at draw time
# to switch fonts mid-string (render.c's own draw_hud_event/draw_game_over used to do
# exactly that split; both are back to a single plain draw call now that this font does
# the combining instead). Still named "menu" (not renamed to e.g. "menu_small") -- every
# caller already references `PNX_ASSET_FONT_MENU`/`g->menu_font`, and this is still,
# semantically, "the menu font," just sourced from two faces now instead of one.
[[font]]
name = "menu"
source = "art/fonts/RacingEnergy-Personal.otf"
size = 14
depth = 1              # crisp: at this size, antialiasing muddies more than it smooths
threshold = 128
charset = "auto"
extra = "ABCDEFGHIJKLMNOPQRSTUVWXYZ :+0123456789"
license = "Racing Energy -- DEMO/personal use only, not cleared for redistribution"
overlay_source = "art/fonts/MonsterRacing-Personal.otf"
overlay_charset = "0123456789+"
overlay_license = "Monster Racing -- personal use only, not cleared for redistribution"
out = "font_menu.bin"

# The big numeric HUD readouts -- score, race timer (render.c's draw_hud) -- a stylised
# display face instead of the plain menu font, since these need to read at a glance
# while actually driving, not just during a paused/game-over screen. Pure Monster Racing,
# no overlay needed: this font's own charset is 100% digits/colon already, so there is no
# "text" portion for a second face to cover. The speedometer's own value uses the smaller
# "menu" font instead (render.c's draw_speedometer) once the gauge redesign dropped its
# "N MPH" text for a bare number above the gauge's own top bar -- small enough there that
# the big face didn't suit it anymore, and menu's own digits (the overlay above) are the
# same Monster Racing numerals this font uses, just at 14px instead of 20px.
[[font]]
name = "hud"
source = "art/fonts/MonsterRacing-Personal.otf"
size = 20
depth = 1
threshold = 128
charset = "0123456789:"
# Free for personal/non-commercial use per the source distribution (no OSI licence
# accompanies it) -- fine for this project as currently built and run locally, but a
# blocker if Need4Pebble is ever submitted to the Pebble appstore or otherwise
# distributed; a commercial licence or a different display face would be needed first.
license = "Monster Racing -- personal use only, not cleared for redistribution"
out = "font_hud.bin"
