# ------------------------------------------------------------------- traffic car
#
# Used to be `touring_normal` reused via a palette `variants` entry (a recolour only --
# `variants` requires identical frame dimensions, so it could never also make traffic
# smaller). Recolour first: the traffic sheet is the base art with its one body-green
# pixel value (85, 199, 83) programmatically remapped to orange (255, 170, 0), everything
# else (outline, brown accents, transparency) untouched, reported directly ("recolor the
# traffic cars so they stand out on the road") -- see `art/traffic.png`'s own generation,
# no hand-drawn art involved. Then, per a later direct ask ("make the traffic cars 10%
# smaller"), that recoloured sheet was resized 90% (`art/traffic_small.png`, PIL LANCZOS,
# a one-off offline script, not a build-time step) and every frame rect scaled by the
# same 0.9 and re-rounded from it -- a genuinely separate, smaller sprite, not another
# `variants` entry, since geometry (not just colour) had to change this time. Costs a
# real second copy of every frame rather than one shared palette slot, but at ~81% of
# touring_normal's own pixel area (0.9 linear -> ~0.81 area) that's an acceptable trade
# for a real size change `variants` structurally cannot express. draw_traffic (render.c)
# passes no palette override here -- the sheet's own pixels are already orange, unlike
# touring_normal's own green original.
#
# A few frames' width got nudged +1px past the exact 0.9 scale (e.g. the first row's
# 39->40, not 39): the pipeline requires each frame's own w*h to be EVEN (4bpp packs two
