# --------------------------------------------------------------------------- menu

# The pause menu's only text -- uppercase and short by choice, so `extra` can just be
# every uppercase letter plus space/colon rather than tracking exact wording here.
[[font]]
name = "menu"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 12
depth = 1              # crisp: at 12px, antialiasing muddies more than it smooths
threshold = 128
charset = "auto"
extra = "ABCDEFGHIJKLMNOPQRSTUVWXYZ :"
license = "SIL Open Font License 1.1"
out = "font_menu.bin"
