# Audio stress test.
#
# The point is not the tune. It is whether music and effects coexist without underruns:
# four sequenced channels running continuously while lasers and explosions steal voices.
# That is the one M4 claim host tests cannot settle.

[project]
name = "audiotest"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 262144

# ------------------------------------------------------------------------------ music

# Corneria-INSPIRED, not a transcription: a bright fanfare over a walking bass, which is
# what makes that piece a good audio test -- sustained lead notes to expose envelope
# problems, a moving bass line to exercise a second channel, and a wide range to catch
# pitch errors at the extremes. The original is Nintendo's composition; this is not it.

[music.theme]
# Restored to tempo now that the stream is clean. It ran at 50bpm while the mixer was being
# diagnosed, because a row of 300ms is long enough to hear whether a held note is steady --
# at 132bpm a row is 113ms and a 16-row pattern is over in 1.8s, too fast to judge. That
# was a diagnostic setting, not a musical one: the piece is a fanfare and wants the pace.
tempo = 132
channels = 4

# A row at 132bpm is 113ms, so every stage has to fit inside that. A release longer than a
# row makes each note outlive the one replacing it.
[[music.theme.instrument]]
wave = "triangle"       # 0: lead
attack = 6
decay = 70
sustain = 165
release = 60

[[music.theme.instrument]]
wave = "square"         # 1: bass
attack = 2
decay = 40
sustain = 190
release = 45

[[music.theme.instrument]]
wave = "saw"            # 2: harmony -- an octave below the lead, so the two do not
attack = 10             #    compete for the same register and muddy each other
decay = 80
sustain = 120
release = 70

# '.' holds, '-' releases. Four cells per row: lead, harmony, spare, bass.
# Percussion instrument: noise with almost no envelope, so it reads as a hit rather than
# a pitch. Channel 2 was empty before, which left the piece with no rhythmic anchor at all.
[[music.theme.instrument]]
wave = "noise"          # 3: percussion
attack = 1
decay = 25
sustain = 0
release = 15

# The song. Twelve bars of material arranged into 22, which is what makes it a song rather
# than a loop: at 132bpm a 16-row pattern is one bar of 1.82s, so four bars repeating was
# over in seven seconds and grating by the third pass. Structure is intro / A / A / B /
# break / bridge / A / outro -- about 40 seconds before it comes back around.
#
# D natural minor throughout (D E F G A A# C), which is where the original test material
# already sat. The two diagnostic patterns are still here, at the end and out of the order
# list, because they are worth keeping and not worth listening to.

# 0 -- INTRO. Drums and bass alone, so the beat establishes before anything melodic.
[[music.theme.pattern]]
rows = [
  ".     .     C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  ".     .     A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     .     .    ",
  ".     .     C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  ".     .     A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     G5:3  C3:1 ",
]

# 1 -- INTRO B. The saw harmony enters on chord tones, walking D minor up to C.
[[music.theme.pattern]]
rows = [
  ".     D3:2  C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  ".     F3:2  A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     .     .    ",
  ".     A3:2  C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  ".     C4:2  A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     -     G5:3  C3:1 ",
]

# 2 -- A (a). The theme: a rising fanfare on the triangle, D up to A and back.
[[music.theme.pattern]]
rows = [
  "D5:0  D3:2  C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  "F5:0  .     A4:3  .    ",
  ".     .     .     .    ",
  "A5:0  F3:2  G5:3  A2:1 ",
  ".     .     .     .    ",
  ".     .     C3:3  D3:1 ",
  ".     .     .     .    ",
  "G5:0  .     G5:3  .    ",
  ".     .     .     D3:1 ",
  "F5:0  A3:2  A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     G5:3  C3:1 ",
]

# 3 -- A (b). The answering phrase, over A# and G -- the minor turn.
[[music.theme.pattern]]
rows = [
  "E5:0  A#3:2 C3:3  A#2:1",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     A#2:1",
  "D5:0  .     A4:3  .    ",
  ".     .     .     .    ",
  "C5:0  G3:2  G5:3  G2:1 ",
  ".     .     .     .    ",
  ".     .     C3:3  G2:1 ",
  ".     .     .     .    ",
  "D5:0  .     G5:3  .    ",
  ".     .     .     A2:1 ",
  "E5:0  A3:2  A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     G5:3  E3:1 ",
]

# 4 -- A (c). The theme again from the top of its range, stepping all the way down.
[[music.theme.pattern]]
rows = [
  "A5:0  D4:2  C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     D3:1 ",
  "G5:0  .     A4:3  .    ",
  ".     .     .     .    ",
  "F5:0  A3:2  G5:3  A2:1 ",
  ".     .     .     .    ",
  "E5:0  .     C3:3  D3:1 ",
  ".     .     .     .    ",
  "D5:0  .     G5:3  .    ",
  ".     .     .     D3:1 ",
  "C5:0  F3:2  A4:3  .    ",
  ".     .     .     .    ",
  "D5:0  .     G5:3  A2:1 ",
  ".     .     G5:3  C3:1 ",
]

# 5 -- A (d). Turnaround: releases lead and harmony on row 12 so the bar breathes before
# the section repeats or hands over to B.
[[music.theme.pattern]]
rows = [
  "F5:0  A#3:2 C3:3  A#2:1",
  ".     .     .     .    ",
  "E5:0  .     G5:3  .    ",
  ".     .     .     A#2:1",
  "D5:0  .     A4:3  .    ",
  ".     .     .     .    ",
  "A4:0  C4:2  G5:3  C3:1 ",
  ".     .     .     .    ",
  "D5:0  .     C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     A2:1 ",
  "-     -     A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     G5:3  A2:1 ",
]

# 6 -- B (a). Moves to F, and the lead holds far longer -- long sustains are also the
# case that exposes envelope drift, so the contrast earns its place twice.
[[music.theme.pattern]]
rows = [
  "C5:0  F3:2  C3:3  F3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     F3:1 ",
  ".     .     A4:3  .    ",
  ".     .     .     .    ",
  "D5:0  A3:2  G5:3  C3:1 ",
  ".     .     .     .    ",
  ".     .     C3:3  F3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     F3:1 ",
  "C5:0  C4:2  A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  C3:1 ",
  ".     .     G5:3  .    ",
]

# 7 -- B (b). A full scale climb, A#4 to A5, which is the tension that sends it back to A.
[[music.theme.pattern]]
rows = [
  "A#4:0 A#3:2 C3:3  A#2:1",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     A#2:1",
  "C5:0  .     A4:3  .    ",
  ".     .     .     .    ",
  "D5:0  D4:2  G5:3  D3:1 ",
  ".     .     .     .    ",
  "E5:0  .     C3:3  D3:1 ",
  ".     .     .     .    ",
  "F5:0  .     G5:3  .    ",
  ".     .     .     A2:1 ",
  "G5:0  E4:2  A4:3  .    ",
  ".     .     .     .    ",
  "A5:0  .     G5:3  A2:1 ",
  ".     .     G5:3  A2:1 ",
]

# 8 -- BRIDGE (a). Lead rests and the kick drops out entirely: hats and harmony only. The
# quietest bar in the song, which is what makes the return land.
[[music.theme.pattern]]
rows = [
  ".     D4:2  G5:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     C4:2  .     .    ",
  ".     .     .     A2:1 ",
  ".     .     G5:3  .    ",
  ".     .     .     .    ",
  ".     A#3:2 .     A#2:1",
  ".     .     G5:3  .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     A3:2  G5:3  A2:1 ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
]

# 9 -- BRIDGE (b). Builds back with eighth-note snares under the theme's opening notes --
# the densest percussion in the song, and so the one bar most likely to clip.
[[music.theme.pattern]]
rows = [
  "D5:0  D4:2  C3:3  D3:1 ",
  ".     .     A4:3  .    ",
  ".     .     G5:3  .    ",
  ".     .     A4:3  D3:1 ",
  "F5:0  .     C3:3  .    ",
  ".     .     A4:3  .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     A4:3  .    ",
  "A5:0  A3:2  C3:3  D3:1 ",
  ".     .     A4:3  .    ",
  ".     .     G5:3  .    ",
  ".     .     A4:3  D3:1 ",
  ".     .     C3:3  .    ",
  ".     .     A4:3  .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     A4:3  C3:1 ",
]

# 10 -- BREAK. No lead or harmony: sixteenth-note drums over a bass that moves every row.
# This is the old density test, kept as an arrangement element because it works as one.
[[music.theme.pattern]]
rows = [
  ".     .     C3:3  D3:1 ",
  ".     .     G5:3  .    ",
  ".     .     C3:3  D3:1 ",
  ".     .     G5:3  A2:1 ",
  ".     .     A4:3  D3:1 ",
  ".     .     G5:3  .    ",
  ".     .     C3:3  F3:1 ",
  ".     .     G5:3  A2:1 ",
  ".     .     C3:3  G2:1 ",
  ".     .     G5:3  .    ",
  ".     .     C3:3  G2:1 ",
  ".     .     G5:3  D3:1 ",
  ".     .     A4:3  A2:1 ",
  ".     .     G5:3  .    ",
  ".     .     C3:3  D3:1 ",
  ".     .     G5:3  .    ",
]

# 11 -- OUTRO. Lands on D and releases everything on row 12, leaving four rows of silence
# before the loop restarts. Without that gap the intro's first kick collides with the tail
# of the last chord.
[[music.theme.pattern]]
rows = [
  "D5:0  D4:2  C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     G5:3  .    ",
  ".     .     .     .    ",
  ".     .     A4:3  .    ",
  ".     .     .     .    ",
  ".     .     G5:3  A2:1 ",
  ".     .     .     .    ",
  ".     .     C3:3  D3:1 ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  "-     -     .     -    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
]

# 12 -- DIAGNOSTIC: SINGLE TONE. Not in the order list. One note held for a whole bar with
# no further row events: the control. If this thrums, the fault is in the mixer or the
# stream, because nothing else is happening.
[[music.theme.pattern]]
rows = [
  "A4:0  .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
  ".     .     .     .    ",
]

# 13 -- DIAGNOSTIC: CHROMATIC. Not in the order list. Every semitone across two octaves;
# tuning errors show as uneven steps and aliasing as the top of the run turning harsh.
[[music.theme.pattern]]
rows = [
  "C4:0  .     .     .    ",
  "C#4:0 .     .     .    ",
  "D4:0  .     .     .    ",
  "D#4:0 .     .     .    ",
  "E4:0  .     .     .    ",
  "F4:0  .     .     .    ",
  "F#4:0 .     .     .    ",
  "G4:0  .     .     .    ",
  "G#4:0 .     .     .    ",
  "A4:0  .     .     .    ",
  "A#4:0 .     .     .    ",
  "B4:0  .     .     .    ",
  "C5:0  .     .     .    ",
  "D5:0  .     .     .    ",
  "E5:0  .     .     .    ",
  "F5:0  .     .     .    ",
]

# The arrangement. Bars, not patterns: intro, the A section twice, B twice, a drum break,
# the bridge, A once more, and an outro. 22 bars at 1.82s is roughly 40 seconds.
order = [
  0, 1,                 # intro
  2, 3, 4, 5,           # A
  2, 3, 4, 5,           # A again
  6, 7, 6, 7,           # B
  10,                   # break
  8, 9,                 # bridge
  2, 3, 4, 5,           # A, last time
  11,                   # outro
]

# ---------------------------------------------------------------------------- samples

# Short effects only. One second of PCM is 16KB, so the pipeline caps samples at 1.5s and
# says so rather than letting a bundle grow past the appstore limit. Anything sustained
# belongs in [music.*], where it costs bytes instead of kilobytes.

[sample.laser]
file = "art/laser.wav"

[sample.explosion]
file = "art/explosion.wav"


# ---------------------------------------------------------------- synth instruments
#
# One per plain instrument above, and the pipeline REQUIRES that: a pattern row names one
# instrument index, so if the two tables were different lengths a note would play a
# different sound depending on which table it resolved through.
#
# A build without PNX_USE_SYNTH ignores this table entirely and plays the plain envelopes,
# so the extension is additive in both directions -- the same song blob works either way.
# Build the synth path with:
#
#     PNX_DEFINES=PNX_USE_SYNTH=1 pebble build

# 0: lead. Three saws a few cents apart through a resonant lowpass -- detune is what makes
# a lead sound thick, and it is also what stresses the mix headroom hardest.
[[music.theme.synth]]
filter = "lowpass"
cutoff_base = 60
resonance = 190
cutoff_env = 180
lfo_target = "pitch"
lfo_rate = 40
lfo_depth = 25
reverb = 90
amp = { attack = 5, decay = 200, sustain = 190, release = 150 }
cutoff = { attack = 2, decay = 300, sustain = 80, release = 200 }
osc = [
  { wave = "saw", volume = 200, detune = 0 },
  { wave = "saw", volume = 190, detune = 7 },
  { wave = "saw", volume = 190, detune = -9 },
]

# 1: bass. One narrow pulse an octave down. A 25% duty is hollow in a way a 50% square is
# not, and it costs nothing -- pulse width is a comparison, not a filter.
[[music.theme.synth]]
filter = "lowpass"
cutoff_base = 40
resonance = 120
amp = { attack = 2, decay = 120, sustain = 200, release = 80 }
cutoff = { attack = 1, decay = 200, sustain = 60, release = 100 }
osc = [ { wave = "square", volume = 220, duty = 64, octave = -1 } ]

# 2: percussion. Noise plus a fast downward pitch sweep -- this is the whole reason the
# pitch envelope exists. As PCM the same sound costs 16,000 bytes a second; here it costs
# 48 bytes once, and the sweep is free (measured at 13 ns/sample on device).
[[music.theme.synth]]
filter = "bandpass"
cutoff_base = 150
resonance = 200
pitch_env = 900
pitch_env_decay = 200
amp = { attack = 1, decay = 60, sustain = 0, release = 40 }
cutoff = { attack = 1, decay = 80, sustain = 20, release = 60 }
osc = [ { wave = "noise", volume = 255 } ]

# 3: pad. Pulse-width modulation under a triangle an octave up -- the LFO routed to duty,
# which is the most recognisable chiptune texture there is.
[[music.theme.synth]]
filter = "lowpass"
cutoff_base = 90
resonance = 60
lfo_target = "duty"
lfo_rate = 60
lfo_depth = 60
chorus = 110
amp = { attack = 8, decay = 250, sustain = 160, release = 200 }
cutoff = { attack = 4, decay = 300, sustain = 90, release = 220 }
osc = [
  { wave = "square", volume = 200, duty = 96 },
  { wave = "triangle", volume = 140, octave = 1, detune = 4 },
]


# ----------------------------------------------------------------------------- font
#
# The HUD used to draw through `pnx_platform_text_draw`, which goes through the SDK at
# ~4.3 ms a call. Five calls was 21.5 ms -- 58% of a 37.3 ms frame -- and the diagnostics
# were quietly the most expensive thing in this app.
#
# This is what E7 exists for: a rasterised atlas and a glyph blitter that draws during the
# frame like a sprite, instead of a system call that can only run after the framebuffer is
# released.
#
# `charset = "auto"` derives its glyph set from [dialog.*] pages, and this app has none --
# it is an audio test. So the set is explicit, and covers exactly what the HUD prints.
[[font]]
name = "hud"
source = "art/fonts/LiberationSans-Regular.ttf"
size = 14
depth = 1              # crisp: at 14px antialiasing muddies more than it smooths
threshold = 128
charset = " !%()+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
license = "SIL Open Font License 1.1"
out = "font_hud.bin"
