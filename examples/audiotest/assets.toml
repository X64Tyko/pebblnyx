# Audio stress test.
#
# The point is not the tune. It is whether music and effects coexist without underruns:
# four sequenced channels running continuously while lasers and explosions steal voices.
# That is the one M4 claim host tests cannot settle.

[project]
name = "audiotest"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 262144

# ------------------------------------------------------------------------------ music

# Corneria-INSPIRED, not a transcription: a bright fanfare over a walking bass, which is
# what makes that piece a good audio test -- sustained lead notes to expose envelope
# problems, a moving bass line to exercise a second channel, and a wide range to catch
# pitch errors at the extremes. The original is Nintendo's composition; this is not it.

[music.theme]
# Deliberately slow. At 132bpm a row is 113ms, so a 16-row pattern lasted 1.8s and the
# whole suite was over in seven seconds -- far too fast to judge whether a held note is
# clean. At 50bpm a row is 300ms, so a note sustained over 8 rows lasts 2.4s.
tempo = 50
channels = 4

# A row at 132bpm is 113ms, so every stage has to fit inside that. A release longer than a
# row makes each note outlive the one replacing it.
[[music.theme.instrument]]
wave = "triangle"       # 0: lead
attack = 6
decay = 70
sustain = 165
release = 60

[[music.theme.instrument]]
wave = "square"         # 1: bass
attack = 2
decay = 40
sustain = 190
release = 45

[[music.theme.instrument]]
wave = "saw"            # 2: harmony -- an octave below the lead, so the two do not
attack = 10             #    compete for the same register and muddy each other
decay = 80
sustain = 120
release = 70

# '.' holds, '-' releases. Four cells per row: lead, harmony, spare, bass.
# Percussion instrument: noise with almost no envelope, so it reads as a hit rather than
# a pitch. Channel 2 was empty before, which left the piece with no rhythmic anchor at all.
[[music.theme.instrument]]
wave = "noise"          # 3: percussion
attack = 1
decay = 25
sustain = 0
release = 15

# Four diagnostic patterns, each isolating a different failure mode. Played in order, so
# a fault that appears in one and not the others names itself.

# 0 -- SUSTAIN. Long held notes, nothing else moving. Any click, dropout, or pitch drift
# is obvious against silence; this is the pattern that caught the short-write glitching.
[[music.theme.pattern]]
rows = [
  "D5:0  .     .     D3:1",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  "-     .     .     -   ",
  "A5:0  .     .     A2:1",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  ".     .     .     .   ",
  "-     .     .     -   ",
]

# 1 -- CHROMATIC. Every semitone in sequence across two octaves. Tuning errors show up as
# uneven steps, and aliasing shows up as the top of the run turning harsh.
[[music.theme.pattern]]
rows = [
  "C4:0  .     .     .   ",
  "C#4:0 .     .     .   ",
  "D4:0  .     .     .   ",
  "D#4:0 .     .     .   ",
  "E4:0  .     .     .   ",
  "F4:0  .     .     .   ",
  "F#4:0 .     .     .   ",
  "G4:0  .     .     .   ",
  "G#4:0 .     .     .   ",
  "A4:0  .     .     .   ",
  "A#4:0 .     .     .   ",
  "B4:0  .     .     .   ",
  "C5:0  .     .     .   ",
  "D5:0  .     .     .   ",
  "E5:0  .     .     .   ",
  "F5:0  .     .     .   ",
]

# 2 -- DENSITY. Busy percussion over a moving bass, which is this piece's actual character:
# four of eleven reference tracks are bass and the drum channel is the densest of all.
# Clipping and mix headroom problems surface here first.
[[music.theme.pattern]]
rows = [
  ".     .     C4:3  D3:1",
  ".     .     G5:3  .   ",
  ".     .     C4:3  D3:1",
  ".     .     G5:3  A2:1",
  ".     .     C4:3  D3:1",
  ".     .     G5:3  .   ",
  ".     .     C4:3  F3:1",
  ".     .     G5:3  A2:1",
  ".     .     C4:3  G2:1",
  ".     .     G5:3  .   ",
  ".     .     C4:3  G2:1",
  ".     .     G5:3  D3:1",
  ".     .     C4:3  A2:1",
  ".     .     G5:3  .   ",
  ".     .     C4:3  D3:1",
  ".     .     G5:3  .   ",
]

# 3 -- ALL FOUR. Everything at once, which is where voice stealing and headroom are under
# real pressure. Effects firing over this is the worst case the mixer will meet.
[[music.theme.pattern]]
rows = [
  "D5:0  A2:2  C4:3  D3:1",
  ".     .     G5:3  .   ",
  "F5:0  .     C4:3  A2:1",
  ".     .     G5:3  .   ",
  "A5:0  D4:2  C4:3  D3:1",
  ".     .     G5:3  .   ",
  "G5:0  .     C4:3  A2:1",
  ".     .     G5:3  .   ",
  "F5:0  C4:2  C4:3  F3:1",
  ".     .     G5:3  .   ",
  "E5:0  .     C4:3  C4:1",
  ".     .     G5:3  .   ",
  "D5:0  A3:2  C4:3  D3:1",
  ".     .     G5:3  .   ",
  "-     -     C4:3  A2:1",
  ".     .     G5:3  -   ",
]

order = [0, 1, 2, 3]

# ---------------------------------------------------------------------------- samples

# Short effects only. One second of PCM is 16KB, so the pipeline caps samples at 1.5s and
# says so rather than letting a bundle grow past the appstore limit. Anything sustained
# belongs in [music.*], where it costs bytes instead of kilobytes.

[sample.laser]
file = "art/laser.wav"

[sample.explosion]
file = "art/explosion.wav"
