# Pebble Pinbeasts. No baked content yet -- v1 draws everything with pnx_gfx_fill_rect
# placeholders (see ../README.md), so there is nothing here for the asset pipeline to
# pack. This file exists so the pebblnyx editor recognises the folder as a project at
# all (tools/pnx_project.py: a project is a folder with a .pknproj OR an assets.toml) --
# add real [[sprite]]/[[font]]/etc. sections here once actual art lands.

[project]
name = "Pebble Pinbeasts"
resources = "resources"
header = "src/c/assets_gen.h"
budget_bytes = 262144
orientation = "buttons_left"

# Runtime already forces this unconditionally in main() via
# pnx_platform_set_screen_lock(true) (BACK is the right flipper, not a spare button --
# see ../README.md). This just makes the editor's Device panel/emulator launch agree
# with what the app already does on its own, rather than fighting it during testing.
force_screen_lock = true


[[atlas]]
name = "board"
sheet = "Reference/Game Boy _ GBC - Pokemon Pinball - Tables & Special Stages - Blue Table.png"
tile = 16
# In TILE units, not pixels.
region = [0, 1, 12, 17]
max_tiles = 255
out = "board.bin"

metatiles = "auto"
# Roles the legend can name. Autopicked so the atlas is usable the moment it is
# imported; replace with an explicit [atlas.semantic] table once you know which tiles
# you want, and no map or game code changes.
autopick = ["floor", "wall", "accent"]

# Collision is a property of the tile, not of where a map paints it -- see
# [[atlas.collision]] in any built example. "wall" solid by default so a freshly
# imported atlas is usable the moment it lands, same as the roles above.
offset = [8, 8]
# Cells dropped in the editor. Indices into the region, read left to right,
# top to bottom -- so they follow the region above and change with it.
exclude = [
  18, 23, 30, 35, 39, 40, 41, 42, 51, 52, 53, 54, 82, 83, 94, 95,
  99, 102, 106, 107, 118, 119, 130, 131, 137, 142, 143, 146, 149, 151, 154, 155,
  159, 160, 161, 162, 166, 167, 178, 179, 190, 191, 196, 197, 202, 203
]
[[atlas.collision]]
tile = "wall"
type = "solid"

[[atlas.collision]]
