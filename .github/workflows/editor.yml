# Builds the editor for every desktop platform, and releases it on a tag.
#
# The editor carries the pnx engine inside it -- a project anywhere on disk builds
# against the copy in the editor doing the building. So these artefacts are not just a
# GUI: they are the whole authoring and compiling side of the framework, minus the Pebble
# SDK, which cannot be redistributed and is installed from the editor's Settings tab
# instead. See docs/EDITOR.md.
#
# Deliberately NOT signed or notarised. That needs an Apple Developer account and a
# Windows code-signing certificate, neither of which exists yet; until they do, macOS
# users need one right-click-Open and Windows users may see SmartScreen. Recorded here
# rather than discovered on a release day.

name: editor

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed by the release job; the rest only read

jobs:
  # Runs first and gates the builds. Producing installers from a tree whose tests fail
  # is worse than producing none, because the artefact looks legitimate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pip pillow

      # tests/test_assets.py needs a real TTF to exercise the font pipeline, and it
      # SKIPS rather than fails when it cannot find one. A suite that quietly stops
      # testing a feature is worse than one that fails, so the font is installed
      # explicitly rather than hoped for.
      - name: Install a font for the rasteriser tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Fail if the font tests would skip
        run: |
          python -c "
          import sys; sys.path.insert(0, 'tests')
          import test_assets
          assert test_assets.TEST_TTF, 'no TTF found; the font tests would silently skip'
          print('font tests will run against', test_assets.TEST_TTF)"

      # Must come FIRST. The generated header and the .bin blobs are derived from the
      # manifest and therefore gitignored, and tests/test_assets.c #includes the header
      # and reads those blobs -- so on a fresh checkout the host tests do not compile
      # until the pipeline has run.
      - name: Examples build through the pipeline
        run: |
          for m in examples/*/assets.toml; do
            echo "--- $m"
            python tools/pnx_assets.py "$m"
          done

      # M4c's claim is that ONE manifest compiles to either orientation -- the content is
      # rotated at build time, not the framebuffer at run time. tests/test_assets.py holds
      # the pipeline to that on a synthetic manifest; this holds it to the real example,
      # whose art, maps, sprites and fonts are the things that actually turn.
      #
      # Into a scratch directory, so the landscape blobs cannot be left behind for the
      # host tests to read as if they were the portrait ones.
      - name: Examples build in landscape too
        run: |
          for m in examples/*/assets.toml; do
            for o in buttons_top buttons_bottom; do
              echo "--- $m ($o)"
              d="$(mktemp -d)"
              python tools/pnx_assets.py "$m" --orientation "$o" \
                     --out "$d/res" --header "$d/gen.h"
            done
          done

      # The editor compares its own version against release tags to decide whether an
      # update exists. A tag that disagrees with the code is therefore not a cosmetic
      # mistake: ship v0.2.0 with EDITOR_VERSION still 0.1.0 and every running copy is
      # told it is up to date, permanently. Cheaper to fail here than to find out never.
      - name: Tag and EDITOR_VERSION agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from pnx_project import EDITOR_VERSION
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          if tag != EDITOR_VERSION:
              sys.exit(f"tag {tag!r} != EDITOR_VERSION {EDITOR_VERSION!r} "
                       f"-- bump tools/pnx_project.py before tagging")
          print(f"tag and EDITOR_VERSION agree: {tag}")
          PY

      - name: Host tests (framework)
        run: make -C tests test-c

      - name: Pipeline tests (asset validation)
        run: python tests/test_assets.py

      # The scaffold is what every new project starts from, so "it compiles" is a claim
      # worth checking on every push rather than the first time someone tries it.
      - name: Scaffold a project and build its assets
        run: |
          python - <<'PY'
          import sys, tempfile, os
          sys.path.insert(0, 'tools')
          import pnx_project as pp, pnx_assets as pa
          d = os.path.join(tempfile.mkdtemp(), 'ci-game')
          pp.create(d, 'CI Game')
          assert os.path.exists(os.path.join(d, '.pknproj'))
          assert os.path.exists(os.path.join(d, 'src', 'c', 'pnx', 'pnx.h')), 'engine not staged'
          pa.build(os.path.join(d, 'assets.toml'), None, None,
                   package=os.path.join(d, 'package.json'))
          print('scaffold builds:', d)
          PY

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04       # oldest glibc we support; newer would not run on it
            tag: linux-x86_64
          - os: windows-latest
            tag: windows-x86_64
          # Oldest GA macOS image, for the same reason ubuntu-22.04 is pinned above: a
          # binary built against a newer SDK will not run on an older OS, and the point of
          # these artefacts is that someone can download and run one.
          #
          # NOT macos-13/macos-14. macos-13 was RETIRED and a job asking for it is never
          # assigned a runner -- it does not fail, it sits queued until GitHub's 24-hour
          # timeout, which also means `release` (needs: build) never runs and a tag
          # produces nothing. macos-14 still works but is marked deprecated, so it is the
          # next one to go the same way. Check labels against
          # https://github.com/actions/runner-images#available-images before changing.
          - os: macos-15-intel     # Intel
            tag: macos-x86_64
          - os: macos-15           # Apple silicon
            tag: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        # certifi is not optional for a packaged build: the frozen binary carries
        # its own OpenSSL with the build machine's CA paths compiled in, so without
        # a bundled root store it cannot verify github.com and the updater reports
        # the network as unreachable. build_editor.py refuses to package without it.
        run: python -m pip install --upgrade pip pyinstaller pillow certifi

      # pywebview gives the editor a native window instead of a browser tab. Its backend
      # is per-platform, and Linux is the one that does not work out of the box: the GTK
      # binding (PyGObject) does not survive PyInstaller cleanly and the Qt one would add
      # ~200MB. So Linux ships the browser fallback, which is a supported path rather
      # than a defect -- the app is still one file that needs no install.
      - name: Install native-window backend (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install pywebview

      - name: Install native-window backend (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install pywebview pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Build and package
        run: python tools/build_editor.py --clean --package

      # Does this artefact carry everything it claims to? Python, Pillow, the pipeline and
      # the engine sources all ship INSIDE the binary -- that is what makes installing it
      # need no Python and no pip -- and PyInstaller drops things quietly. Checked on
      # every platform, because a hidden import can be collected on one and missed on
      # another. The exit code is what matters here: a --windowed build on Windows has no
      # console to print to.
      - name: The bundle carries its dependencies
        shell: bash
        run: |
          BIN=dist/pebblnyx-editor
          [ "$RUNNER_OS" = "Windows" ] && BIN=dist/pebblnyx-editor.exe
          "$BIN" --selftest

      # A binary that starts, serves, and reports the engine it carries. Catches the
      # failure this whole design is exposed to: PyInstaller silently omitting the
      # bundled engine, which would produce an editor that opens projects and cannot
      # build one.
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist/pebblnyx-editor
          [ "$RUNNER_OS" = "Windows" ] && BIN=dist/pebblnyx-editor.exe
          "$BIN" --port 8899 --no-browser &
          PID=$!
          sleep 12
          curl -sf http://127.0.0.1:8899/api/state > /dev/null || { echo "server did not start"; exit 1; }
          curl -sf http://127.0.0.1:8899/api/project/recent > recent.json || exit 1
          cat recent.json
          python -c "import json;d=json.load(open('recent.json'));assert d['have_engine'],'engine missing from the bundle';print('engine',d['engine'],'OK')"
          kill $PID || true

      # Everything packaged carries the platform tag in its name -- `pebblnyx-editor-
      # linux-x86_64.tar.gz`, `-windows-x86_64-setup.exe` -- while the raw PyInstaller
      # output does not. So one glob collects the deliverables per platform and leaves
      # the loose binary and the .app behind, without the matrix having to list the
      # extensions each platform happens to produce.
      - uses: actions/upload-artifact@v4
        with:
          name: pebblnyx-editor-${{ matrix.tag }}
          path: dist/pebblnyx-editor-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A tag with a suffix -- v0.1.0-beta.1, v0.2.0-rc.2 -- is a prerelease. Derived from
    # the tag rather than set by hand, because the one time it is set by hand is the time
    # a beta goes out looking like a stable release.
    env:
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true          # a human decides when it is actually published
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
          body: |
            ## pebblnyx editor

            Download one file for your machine and run it. No Python, no pip, nothing to
            set up.

            | | | |
            |---|---|---|
            | **Windows** | `windows-x86_64-setup.exe` | installer — Start menu entry, no admin rights needed |
            | | `windows-x86_64.zip` | or the bare .exe, if you prefer it portable |
            | **macOS** (Apple silicon) | `macos-arm64.dmg` | open it, drag the app into Applications |
            | **macOS** (Intel) | `macos-x86_64.dmg` | same |
            | **Linux** | `linux-x86_64.tar.gz` | extract, then `./pebblnyx-editor` — or `./install.sh` to add it to your menu |

            The **pnx engine ships inside the editor**: create a project anywhere and it
            builds against the engine in the editor doing the building.

            **The Pebble SDK is not included** and cannot be — Pebble licenses it to you
            personally and its terms forbid redistribution. Everything except producing a
            `.pbw` works without it; the Settings tab shows the licence and installs it
            for you on request.

            Not code-signed yet: macOS needs one right-click → Open on first launch, and
            Windows may show a SmartScreen prompt. Nothing here asks for administrator
            rights — the Windows installer writes only under your user profile.
